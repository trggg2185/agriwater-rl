services:
  api:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -c requirements.txt fastapi uvicorn gymnasium numpy PyYAML
        COPY agriwater/ agriwater/
        COPY configs/ configs/
        CMD ["python", "-m", "uvicorn", "agriwater.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

  web3d:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine AS frontend
        WORKDIR /app
        COPY web3d/package.json web3d/package-lock.json ./
        RUN npm ci
        COPY web3d/ ./
        RUN npm run build

        FROM nginx:alpine
        COPY web3d/nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=frontend /app/dist/ /usr/share/nginx/html/
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
