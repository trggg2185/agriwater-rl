# Demo assumptions; uniform forecasts, Bernoulli rain occurrence.
# Dry temperature and stormy probability/forecast limits follow report section IV.
dry:
  description: Dry
  temperature_range_c: [35, 42]
  rain_probability_range: [0, 0.05]
  rain_amount_range_mm: [0, 5]
stormy:
  description: Stormy
  temperature_range_c: [20, 30]
  rain_probability_range: [0.70, 1.0]
  rain_amount_range_mm: [15, 50]
random:
  description: Random
  temperature_range_c: [15, 45]
  rain_probability_range: [0, 1]
  rain_amount_range_mm: [0, 50]
