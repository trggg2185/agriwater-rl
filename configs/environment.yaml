# Quy uoc mo phong, chua duoc hieu chuan bang du lieu thuc dia.
max_days: 30
default_scenario: random
action_liters: [0, 5, 10, 15, 20, 25]
moisture:
  ideal_default: [0.40, 0.70]
  ideal_stage_2: [0.50, 0.75]
  stress_bounds: [0.20, 0.85]
reward:
  health: 10
  stress: -100
  water_per_action: -2
  waste_per_action: -10
  rain_per_action: -5
  delay_per_action: -8
  waste_moisture: 0.60
  rain_probability: 0.70
  rain_forecast_mm: 15
  previous_irrigation_liters: 12.5
# Demo assumptions, NOT calibrated agricultural/FAO-56 data.
water_balance:
  plot_area_m2: 1.0 # m2; can de quy doi 1 mm mua = 1 lit/m2
  soil_capacity_liters: 100.0 # lit tai do am chuan hoa 1
  irrigation_efficiency: 0.85 # ty le 0-1
  rain_efficiency: 0.8 # ty le 0-1
  evapotranspiration_liters_per_day: 3.0 # lit/ngay; mo hinh nhiet do gia dinh demo
  drainage_liters_per_day: 5.0 # lit/ngay; mo hinh tieu thoat gia dinh demo
  et_temperature_slope: 0.15 # L/ngay/do C tren 15 C; de xuat ET tuyen tinh
  crop_factors: [0.9, 1.0, 1.1, 1.2] # list 4 he so khong don vi, theo ma cay 0-3
  stage_factors: [0.7, 1.0, 1.2, 0.8] # list 4 he so khong don vi, theo giai doan 0-3
  drainage_threshold: 0.70 # do am 0-1 bat dau tieu thoat
  repeat_irrigation_threshold_liters: 12.5 # L, nguong anh huong tuoi lap
  repeat_irrigation_efficiency: 0.85 # 0-1, nhan hieu suat khi tuoi lap
growth_stage_days: [8, 16, 24] # moc chuyen giai doan theo ngay, gia dinh demo
biological_termination: [0.05, 0.95] # dieu kien sinh hoc gia dinh demo
initial_state:
  crop_type: 0 # ma nguyen 0-3
  growth_stage: 0 # ma nguyen 0-3
  soil_moisture_range: [0.40, 0.70] # [low, high] trong [0,1], uniform khi reset
