[project]
name = "agriwater-rl"
version = "0.1.0"
description = "Bootstrap for irrigation reinforcement learning experiments"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["main.py", "Prompt.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
